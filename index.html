                        'pulse-glow': 'pulseGlow 2.5s infinite ease-in-out',
                        'float': 'float 4s ease-in-out infinite'

                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.99)' },

                                                        <span className="truncate">Focus: High-Touch Strategy & Vision</span>
                                                    </span>
                                                    <span className="font-bold shrink-0">Exponential Impact</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Requisite Mindset Shift & Action Box */}
                                        <div className="glass-panel p-6 sm:p-8 rounded-3xl border border-cyan-500/40 relative overflow-hidden">
                                            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
                                                <div className="flex items-start gap-4">
                                                    <div className="p-3 bg-cyan-500/20 rounded-2xl text-cyan-400 shrink-0 mt-1">
                                                        <Icon name="brain" className="w-6 h-6 flex-shrink-0" />
                                                    </div>
                                                    <div>
                                                        <div className="text-xs font-mono text-cyan-400 uppercase font-extrabold tracking-wider">
                                                            REQUISITE MINDSET SHIFT FOR THIS ROLE
                                                        </div>
                                                        <h4 className="text-base sm:text-lg font-bold text-slate-100 mt-1 leading-snug">
                                                            {activeDetailRole.mindsetShift}
                                                        </h4>
                                                    </div>
                                                </div>

                                                <button
                                                    onClick={handleBackToCatalog}
                                                    className="px-6 py-3 rounded-2xl bg-cyan-500 text-black font-extrabold text-xs font-mono hover:bg-cyan-400 transition-all shrink-0 shadow-lg shadow-cyan-500/20"
                                                >
                                                    ← Back to All Roles Catalog
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* TAB 2: EMERGING NEW JOBS */}
                        {activeTab === 'emerging' && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="glass-panel p-6 sm:p-8 rounded-3xl relative overflow-hidden border border-emerald-500/30">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-950/90 border border-emerald-500/40 text-emerald-400 text-xs font-mono mb-3">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                        <span>NEW CAREER HORIZONS 2030</span>
                                    </div>
                                    <h2 className="text-2xl sm:text-4xl font-extrabold tracking-tight">
                                        Brand New <span className="text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">Roles Created by AI</span>
                                    </h2>
                                    <p className="text-slate-300 text-sm sm:text-base mt-2 max-w-2xl leading-relaxed">
                                        These high-demand positions didn't exist a decade ago. As AI autonomous agents and spatial computing scale, these roles become critical.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {EMERGING_NEW_JOBS.map((job, idx) => (
                                        <div key={idx} className="glass-panel p-6 rounded-2xl border border-slate-800 hover:border-emerald-500/50 smooth-hover flex flex-col justify-between group min-w-0">
                                            <div>
                                                <div className="flex items-center justify-between mb-3 gap-2">
                                                    <span className="px-2.5 py-1 rounded bg-emerald-950 border border-emerald-800 text-emerald-400 text-[11px] font-mono font-semibold truncate">
                                                        {job.category}
                                                    </span>
                                                    <span className="text-xs font-mono text-cyan-400 font-bold shrink-0">
                                                        {job.growth}
                                                    </span>
                                                </div>

                                                <h3 className="text-lg font-bold text-slate-100 group-hover:text-emerald-300 transition-colors mb-2 leading-snug">
                                                    {job.title}
                                                </h3>

                                                <p className="text-slate-300 text-xs leading-relaxed mb-4">
                                                    {job.description}
                                                </p>

                                                <div className="space-y-2 mb-4 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800/80">
                                                    <div className="text-[11px] font-mono text-slate-400 uppercase">Why this role exists:</div>
                                                    <p className="text-xs text-slate-300 italic leading-relaxed">{job.whyItExists}</p>
                                                </div>
                                            </div>

                                            <div>
                                                <div className="text-[11px] font-mono text-slate-400 uppercase mb-2">Core Skillset:</div>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {job.skills.map((skill, sIdx) => (
                                                        <span key={sIdx} className="px-2 py-0.5 rounded bg-slate-900 border border-slate-800 text-[11px] text-slate-300 font-mono">
                                                            {skill}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 3: MINDSET SHIFTS */}
                        {activeTab === 'mindset' && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="glass-panel p-6 sm:p-8 rounded-3xl relative overflow-hidden border border-purple-500/30">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-950/90 border border-purple-500/40 text-purple-300 text-xs font-mono mb-3">
                                        <Icon name="brain" className="w-3.5 h-3.5 flex-shrink-0" />
                                        <span>CAREER SURVIVAL STRATEGY</span>
                                    </div>
                                    <h2 className="text-2xl sm:text-4xl font-extrabold tracking-tight">
                                        Core Thinking Upgrades <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-cyan-400">for 2030</span>
                                    </h2>
                                    <p className="text-slate-300 text-sm sm:text-base mt-2 max-w-2xl leading-relaxed">
                                        Upgrading software tools is easy; upgrading how you think guarantees long-term career resilience. Here are 4 paramount mental shifts.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {MINDSET_UPGRADES.map((m) => (
                                        <div key={m.num} className="glass-panel p-6 rounded-2xl border border-slate-800 hover:border-purple-500/40 smooth-hover flex flex-col justify-between min-w-0">
                                            <div>
                                                <div className="flex items-center justify-between mb-4">
                                                    <span className="text-2xl font-black font-mono text-purple-400">{m.num}</span>
                                                    <div className="p-2.5 rounded-xl bg-purple-500/10 text-purple-300 border border-purple-500/20 shrink-0">
                                                        <Icon name={m.icon} className="w-5 h-5 flex-shrink-0" />
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 my-4">
                                                    <div className="p-4 rounded-xl bg-red-950/30 border border-red-500/20">
                                                        <div className="text-[10px] font-mono text-red-400 uppercase font-bold">OLD THINKING</div>
                                                        <div className="font-bold text-slate-200 text-sm mt-1">{m.from}</div>
                                                        <p className="text-xs text-slate-400 mt-1 leading-relaxed">{m.fromDesc}</p>
                                                    </div>

                                                    <div className="p-4 rounded-xl bg-emerald-950/30 border border-emerald-500/20">
                                                        <div className="text-[10px] font-mono text-emerald-400 uppercase font-bold">2030 UPGRADE</div>
                                                        <div className="font-bold text-emerald-300 text-sm mt-1">{m.to}</div>
                                                        <p className="text-xs text-slate-300 mt-1 leading-relaxed">{m.toDesc}</p>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="mt-4 pt-4 border-t border-slate-800 bg-slate-950/80 p-3.5 rounded-xl">
                                                <div className="text-xs font-mono text-cyan-400 font-bold uppercase mb-1">Actionable Shift Rule:</div>
                                                <p className="text-xs text-slate-200 font-medium leading-relaxed">{m.keyAction}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="glass-panel border-t border-slate-800/80 py-6 px-4 md:px-8 mt-12 text-center text-xs text-slate-400 font-mono">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div>
                                <span className="text-slate-300 font-bold">WORKFORCE 2030</span> | AI Job Transformation & Career Upgrade Portal
                            </div>
                            <div className="flex items-center gap-2 bg-slate-950/90 px-3.5 py-1.5 rounded-full border border-slate-800 shadow-md">
                                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>Designed & Developed by <strong className="text-cyan-400 font-bold">Michael Ranuka Gamage</strong></span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
